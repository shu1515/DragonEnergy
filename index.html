<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>まっど純</title>
    <style>

        /*配信画面・コメント欄のサイズ定義*/
        :root{
            --VIDEO_HEIGHT:700px;   /*配信画面：高さ*/
            --VIDEO_WIDTH:600px;    /*配信画面：幅*/
            --CHAT_WIDTH:300px;     /*チャット：幅*/
        }

        /*サイト全体のデザイン*/
        body{
            background-color:#121212;   /*背景：高級感のある黒*/
            color:#ffffff;              /*文字：白*/
            font-family:sans-serif;       /*文字フォント：ゴシック体*/
            padding:20px;
        }

        /*入力エリアのデザイン*/
        InputArea{
            background-color:#1f1f23;
            padding:15px;
            border-radius:8px;
            margin-bottom:20px;
            max-width:1000px;
        }

        InputGroup{
            margin-bottom:10px;
        }

        input{
            padding:8px;
            width:250px;
            border-radius:4px;
            border:1px solid #464649;
            background-color:#0e0e10;
            color:white;
        }

        /*変更ボタン*/
        .ApplyButton{
            padding:8px 15px;
            background-color:#9135ff; /*Twitchカラーに寄せている*/
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-weight:bold;
        }
        .ApplyButton:hover{
            background-color:#772ce8;
        }

        /*お気に入りボタン*/
        .FavoriteButtons{
            display: inline-block;
            margin-left:15px;
        }
        .FavoriteButton{
            padding: 6px 12px;
            background-color: #3a3a3d;
            color: #efeff1;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 13px;
        }
        .FavoriteButton:hover{
            background-color: #464649;
        }

        /*配信画面を横並びにするための設定*/
        #MultiviewWrapper{
            display:flex;
            flex-wrap:wrap; /*画面幅が足りないときは下に落ちる*/
            gap:30px;       /*窓の隙間*/
        }

        /*タイトル・配信画面を縦に並べる設定*/
        WindowBlock{
            display: flex;
            flex-direction:column;  /*タイトル・配信画面を縦に並べる*/
        }

        /*動画とチャットを横並びにする設定*/
        TwitchContainer{
            display:flex;       /*横並びに*/
            gap:10px;           /*動画とチャットの隙間*/
            max-width:1920px;   /*全体の横幅の限界*/
            margin-bottom:30px;
            border-top:1px solid #2f2f35;
            padding-top:20px;
        }

        /*すべての iframe にサイズ変数を適用*/
        iframe{
            border:none;        /*枠線を消してすっきりさせる*/
            color-scheme:dark;
        }
        .TwitchVideo{
            width: var(--VIDEO_WIDTH);
            height: var(--VIDEO_HEIGHT);
        }
        .TwitchChat{
            width: var(--CHAT_WIDTH);
            height: var(--VIDEO_HEIGHT);
        }
    </style>
</head>
<body>

    <h1>まっど純</h1>
    <p>ver:2.0.8</p>

    <!--配信者を入力するフォーム（2画面分）-->
    <div class="InputArea">
        <h3>配信者の変更</h3>

        <!--１画面目-->
        <div class="InputGourp">
            <!--配信者入力ボタン-->
            <label>1画面目：</label>
            <input type="text" id="streamer-id-1" value="kato_junichi0817" placeholder="配信者のIDを入力" />
            <button class="ApplyButton" onclick="ChangeStreamer(1)">変更</button>

            <!--お気に入りボタン-->
            <div class="FavoriteButtons">
                <button class="FavoriteButton" onclick="SetFavorite(1, 'kato_junichi0817')">加藤純一</button>
                <button class="FavoriteButton" onclick="SetFavorite(1, 'fps_shaka')">SHAKA</button>
                <button class="FavoriteButton" onclick="SetFavorite(1, 'stylishnoob4')">関優太</button>
                <button class="FavoriteButton" onclick="SetFavorite(1, 'batora324')">バトラ</button>
                <button class="FavoriteButton" onclick="SetFavorite(1, 'fmlch')">UK</button>
            </div>
        </div>

        <!--２画面目-->
        <div class="InputGourp">
            <label>2画面目：</label>
            <input type="text" id="streamer-id-2" value="hanjoudesu" placeholder="配信者のIDを入力" />
            <button class="ApplyButton" onclick="ChangeStreamer(2)">変更</button>

            <!--お気に入りボタン-->
            <div class="FavoriteButtons">
                <button class="FavoriteButton" onclick="SetFavorite(2, 'kato_junichi0817')">加藤純一</button>
                <button class="FavoriteButton" onclick="SetFavorite(2, 'fps_shaka')">SHAKA</button>
                <button class="FavoriteButton" onclick="SetFavorite(2, 'stylishnoob4')">関優太</button>
                <button class="FavoriteButton" onclick="SetFavorite(2, 'batora324')">バトラ</button>
                <button class="FavoriteButton" onclick="SetFavorite(2, 'fmlch')">UK</button>
            </div>
        </div>

    </div> <!--InputArea-->

    <!--表示エリア-->
    <div id="MultiviewWrapper">
        <!--窓１-->
        <div class="WindowBlock">
            <h2>1画面目</h2>
            <div class="TwitchContainer">
                <!--プレイヤー-->
                <iframe 
                    id="video-1"
                    class="TwitchVideo"
                    src="https://player.twitch.tv/?channel=stylishnoob4&parent=shu1515.github.io&autoplay=true"
                    height=WINDOW_HEIGHT
                    width=WINDOW_WIDTH
                    allowfullscreen>
                </iframe>
                <!--チャット欄-->
                <iframe 
                    id="chat-1"
                    class="TwitchChat"
                    src="https://www.twitch.tv/embed/stylishnoob4/chat?darkpopout=true&parent=shu1515.github.io"
                    height=WINDOW_HEIGHT
                    width=CHAT_WIDTH>
                </iframe>
            </div>
        </div>
        <!--窓２-->
        <div class="WindowBlock">
            <h2>2画面目</h2>
            <div class="TwitchContainer">
                <!--プレイヤー-->
                <iframe 
                    id="video-2"
                    class="TwitchVideo"
                    src="https://player.twitch.tv/?channel=kato_junichi0817&parent=shu1515.github.io&autoplay=true"
                    height=WINDOW_HEIGHT
                    width=WINDOW_WIDTH
                    allowfullscreen>
                </iframe>
                <!--チャット欄-->
                <iframe
                    id="chat-2"
                    class="TwitchChat"
                    src="https://www.twitch.tv/embed/kato_junichi0817/chat?darkpopout=true&parent=shu1515.github.io"
                    height=WINDOW_HEIGHT
                    width=CHAT_WIDTH>
                </iframe>
            </div>
        </div>
    </div><!--MultiviewWrapper-->
    
    <!--ボタンが押されたときにURLを書き換える処理-->
    <script>

        // お気に入りボタンが押されたときの動作
        function SetFavorite(windowNum, streamerId){
            // 指定した画面のインプットボックスにIDを自動入力
            document.getElementById('streamer-id-' + windowNum).value = streamerId;

            // 「変更ボタン」を押した扱いにする
            ChangeStreamer(windowNum);
        }

        // 配信者変更ボタンが押されたときの動作
        function ChangeStreamer(windowNum){
            // 入力フォームに入力された文字（ID）を読み取る
            let inputValue = document.getElementById('streamer-id-1').value;
            if(windowNum == 2){
                inputValue = document.getElementById('streamer-id-2').value;
            }

            // URLが入力された場合、ID部分のみを抜き取る処理
            let streamerId = inputValue.trim();
            if(streamerId.includes('twitch.tv/')){
                streamerId = streamerId.split('twitch.tv/')[1].split('?')[0].split('/')[0];
            }

            // 何も入力がない場合は処理しない
            if(!streamerId){
                alert('IDを入力してください');
                return;
            }

            // 対象の iframe を新しく作り変える
            const newVideoUrl = "https://player.twitch.tv/?channel=" + streamerId + "&parent=shu1515.github.io&autoplayer=true"
            const newChatUrl = "https://www.twitch.tv/embed/" + streamerId + "/chat?darkpopout=true&parent=shu1515.github.io"

            document.getElementById('video-'+ windowNum).src = newVideoUrl;
            document.getElementById('chat-'+ windowNum).src = newChatUrl;
        }

    </script>

</body>
</html>
