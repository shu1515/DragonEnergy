<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>純プレイヤー</title>
    <style>

        /*サイト全体の背景色・文字色設定*/
        body{
            background-color:#121212;   /*背景：高級感のある黒*/
            color:#ffffff;              /*文字：白*/
            font-family:sans-serif;     /*文字フォント：ゴシック体*/
            padding:20px;
        }
        twitchContainer{
            display:flex;       /*横並びに*/
            gap:10px;           /*動画とチャットの隙間*/
            max-width:1920px;   /*全体の横幅の限界*/
        }
        iframe{
            border:none;        /*枠線を消してすっきりさせる*/
        }
    </style>
</head>
<body>

    <h1>純 Twitch</h1>
    <p>ver:1.2.0</p>

    <div class="twitchContainer">
        <!--動画プレイヤー-->
        <iframe src="https://player.twitch.tv/?channel=stylishnoob4&parent=shu1515.github.io&autoplay=true"
                height="378"
                width="620"
                allowfullscreen>
        </iframe>

        <!--チャット欄-->
        <iframe src="https://www.twitch.tv/embed4/stylishnoob4/chat?darkpopout&parent=shu1515.github.io"
                height="378"
                width="400">
        </iframe>
    </div>
</body>
</html>
